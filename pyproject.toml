[project]
name = "tlshow"
version = "0.1.0"
description = "AI-built (by Claude): Make, preview, validate and package Tesla custom light shows (FSEQ v2) for Model 3, Y, S, X and Cybertruck"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "zstandard>=0.22",
]

[project.scripts]
tlshow = "tlshow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tlshow"]

[dependency-groups]
dev = ["pytest>=8"]
